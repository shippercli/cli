providers:
  cpanel:
    host: "cpanel.example.com"
    username: "shipper"
    api_token: "test-token"

projects:
  api:
    provider: cpanel
    path: ./examples/api
    repository:
      provider: github
      name: shippercli/cli
    web_directory: /public
    project_root: /
    php_version: "8.3"
    ssl:
      enabled: true
      type: letsencrypt
      force_https: true
    environment:
      variables:
        APP_NAME: "Test API"
        LOG_CHANNEL: "stack"
    deploy_script: |
      composer install --no-dev
    profiles:
      production:
        branch: main
        domain: test-production.example.com
      staging:
        branch: develop
        domain: test-staging.example.com

  frontend:
    provider: cpanel
    path: ./examples/frontend
    repository:
      provider: github
      name: shippercli/cli
    profiles:
      production:
        branch: main
        domain: frontend-production.example.com
      staging:
        branch: develop
        domain: frontend-staging.example.com
