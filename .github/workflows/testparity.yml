name: TestParity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testparity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PEST_NO_PLUGIN: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, gd, intl, mbstring, pdo_sqlite, zip
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Shipper
        run: cp .env.example .env

      - name: Run the full test suite
        run: |
          mkdir -p .parity
          XDEBUG_MODE=coverage vendor/bin/pest --coverage-clover=.parity/coverage.xml --colors=never

      - name: Collect base TestParity report
        id: parity-baseline
        uses: testparity/actions@30a4e2de4295df73868d1d184ff704f0dad3de2e # baseline regression gate
        with:
          post-on-pr: 'false'
          suite-coverage: .parity/coverage.xml
          fail-on-findings: 'false'

      - name: Stage base report
        env:
          REPORT_DIRECTORY: ${{ steps.parity-baseline.outputs.report-directory }}
        run: |
          test -s "$REPORT_DIRECTORY/report.json"
          cp "$REPORT_DIRECTORY/report.json" .parity/baseline.json
          cp "$REPORT_DIRECTORY/report.md" .parity/comment.md

      - name: Preserve base coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testparity-shipper-cli-base
          path: |
            .parity/baseline.json
            .parity/coverage.xml
            .parity/per-test/
            .parity/comment.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  coverage:
    needs: baseline
    if: ${{ !cancelled() && (needs.baseline.result == 'success' || needs.baseline.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.report.outputs.artifact-id }}
    timeout-minutes: 15

    env:
      PEST_NO_PLUGIN: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, gd, intl, mbstring, pdo_sqlite, zip
          coverage: xdebug
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Shipper
        run: cp .env.example .env

      - name: Run the full test suite
        run: |
          mkdir -p .parity
          XDEBUG_MODE=coverage vendor/bin/pest --coverage-clover=.parity/coverage.xml --colors=never

      - name: Download base report
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: testparity-shipper-cli-base
          path: .parity/baseline

      - name: Run TestParity
        id: parity-report
        uses: testparity/actions@30a4e2de4295df73868d1d184ff704f0dad3de2e # baseline regression gate
        with:
          post-on-pr: 'false'
          suite-coverage: .parity/coverage.xml
          fail-on-findings: 'false'
          baseline-report: ${{ github.event_name == 'pull_request' && '.parity/baseline/baseline.json' || '' }}

      - name: Stage TestParity reports
        id: stage-parity
        if: ${{ !cancelled() && steps.parity-report.outputs.report-directory != '' }}
        env:
          REPORT_DIRECTORY: ${{ steps.parity-report.outputs.report-directory }}
        run: |
          cp "$REPORT_DIRECTORY/report.md" .parity/comment.md
          cp "$REPORT_DIRECTORY/report.json" .parity/report.json
          if [ -f "$REPORT_DIRECTORY/baseline-comparison.json" ]; then
            cp "$REPORT_DIRECTORY/baseline-comparison.json" .parity/baseline-comparison.json
          fi

      - name: Upload coverage evidence
        id: report
        if: ${{ !cancelled() && steps.stage-parity.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testparity-shipper-cli
          path: .parity/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  comment:
    needs: coverage
    if: >-
      ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository &&
          needs.coverage.outputs.artifact-id != '' }}
    permissions:
      contents: read
      pull-requests: write
    uses: testparity/actions/.github/workflows/parity-comment.yml@10454fb309cc104296ec001fade186d9330abe65 # v1.1.0
    with:
      artifact-name: testparity-shipper-cli
      report-path: comment.md
