name: CI

on:
  push:
    branches: [ main, copilot/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phar:
    name: Standalone PHAR smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP and Box
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, zip
          coverage: none
          tools: composer:v2, box:4.7.0
      - name: Install production dependencies
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader --no-interaction
      - name: Build PHAR
        run: box compile
      - name: Run binary outside checkout
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          cp builds/shipper "$test_dir/shipper"
          cd "$test_dir"
          chmod +x shipper
          ./shipper --version
          ./shipper validate --help
          ./shipper plan --help

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
    - uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '${{ matrix.php }}'
        extensions: mbstring, xml, ctype, json
        coverage: none
        tools: composer:v2
    
    - name: Verify PHP version
      run: php -v

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v5
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Verify Composer distribution
      run: python3 tests/package/verify_dist.py

    - name: Run Pint (code style check)
      run: composer format:check

    - name: Run PHPStan (static analysis)
      run: composer analyse

    - name: Run tests
      env:
        PEST_NO_PLUGIN: "1"
      run: composer test

  api-example:
    name: API example PHP 8.2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/api
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, curl, zip, dom, sqlite3, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Validate example dependencies
        run: composer validate --strict
      - name: Install on the declared PHP baseline
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run example tests
        run: |
          cp .env.example .env
          php artisan test --fail-on-warning

  api-example-frontend:
    name: API example frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/api/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run build
