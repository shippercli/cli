name: Laravel API example

on:
  push:
    branches: [main]
    paths: ['examples/api/**', '.github/workflows/api-example.yml']
  pull_request:
    paths: ['examples/api/**', '.github/workflows/api-example.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-example-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: examples/api

jobs:
  php:
    name: API PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: composer audit --locked --no-interaction
      - run: cp .env.example .env
      - run: php vendor/bin/phpunit --fail-on-warning --fail-on-risky

  frontend:
    name: API frontend Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/api/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run build
