name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BOX_VERSION: '4.7.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, zip
          coverage: none
          tools: composer:v2, box:${{ env.BOX_VERSION }}

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.3-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run Pint
        run: composer format:check

      - name: Run PHPStan
        run: composer analyse

      - name: Run tests
        env:
          PEST_NO_PLUGIN: '1'
        run: php vendor/bin/pest --no-coverage

      - name: Install production dependencies
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Build PHAR
        run: box compile

      - name: Test binary outside checkout
        run: |
          chmod +x builds/shipper
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          cp builds/shipper "$test_dir/shipper"
          (
            cd "$test_dir"
            version_output="$(./shipper --version)"
            printf '%s\n' "$version_output"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              expected_version="${GITHUB_REF_NAME#v}"
              test "$version_output" = "Shipper $expected_version"
            fi
          )

      - name: Create checksum
        working-directory: builds
        run: sha256sum shipper > shipper.sha256

      - name: Attest release binary
        if: github.ref_type == 'tag'
        uses: actions/attest@v4
        with:
          subject-path: builds/shipper

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            builds/shipper
            builds/shipper.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Shipper CLI Binary
            
            This release includes the standalone Shipper CLI binary, its
            SHA-256 checksum, and GitHub build provenance.
            
            ### Usage
            
            Download the `shipper` binary, make it executable, and run it:
            
            ```bash
            chmod +x shipper
            ./shipper --version
            ```
            
            See the README for full documentation.
